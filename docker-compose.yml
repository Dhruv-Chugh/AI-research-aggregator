services:
  postgres:
    image: postgres:16-alpine
    container_name: axiom_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_news_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_news_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  axiom-dispatch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: axiom_dispatch
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ai_news_db}
      ENVIRONMENT: production
    volumes:
      - ./exports:/app/exports
    command: ["uv", "run", "python", "-m", "app.agent.ranking_agent", "--daemon", "--interval-hours", "24"]

volumes:
  postgres_data:
    name: axiom_postgres_data
