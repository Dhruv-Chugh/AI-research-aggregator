[project]
name = "axiom-dispatch"
version = "1.0.0"
description = "Axiom Dispatch: Autonomous AI Technical Intelligence & IEEE Research Briefing Platform"
readme = "README.md"
authors = [
    { name = "Dhruv Chugh", email = "dhruvchugh2007@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "beautifulsoup4>=4.15.0",
    "click>=8.5.0",
    "feedparser>=6.0.14",
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "openai>=3.42.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pypdf>=7.0.0",
    "python-dateutil>=3.0.0",
    "python-dotenv>=1.2.4",
    "reportlab>=5.1.0",
    "sqlalchemy>=2.1.6",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
axiom-dispatch = "app.agent.email_agent:main"
axiom-scraper = "app.scrapers.runner:main"
axiom-ranker = "app.agent.ranking_agent:main"
ai-news-aggregator = "app.scrapers.runner:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

