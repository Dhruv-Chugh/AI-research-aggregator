# ==============================================================================
# Render Infrastructure-as-Code Blueprint
# Axiom Dispatch: Autonomous AI Technical Intelligence & IEEE Briefing Platform
# ==============================================================================
# Docs: https://render.com/docs/blueprint-spec

version: "1"

databases:
  - name: ai-news-db
    databaseName: ai_news_db
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: ai-research-aggregator
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-news-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8000"
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: SCHEDULER_INTERVAL_HOURS
        value: "24"
      - key: DEFAULT_LOOKBACK_HOURS
        value: "24"
      - key: SEND_LIVE_EMAIL
        value: "true"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: RECIPIENT_EMAIL
        value: dhruvchugh2007@gmail.com
      - key: SUBSCRIBER_NAME
        value: Dhruv Chugh
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_FALLBACK_MODELS
        value: "gemini-3-flash-preview,gemini-3.5-flash-lite"
      - key: RESEND_FROM_EMAIL
        value: "The AI Dispatch <onboarding@resend.dev>"
      - key: RESEND_API_KEY
        sync: false
      - key: YOUTUBE_PROXY
        sync: false
